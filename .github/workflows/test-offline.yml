# Offline pytest suite (excludes live_integration marker).
# Live Supabase: see integration-live.yml (main + workflow_dispatch + secrets).

name: Identity tests (offline)

on:
  push:
  pull_request:

jobs:
  pytest-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pytest (offline — not live_integration)
        run: python -m pytest -q -m "not live_integration" --tb=short --junitxml=pytest-results.xml

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml
          if-no-files-found: ignore
